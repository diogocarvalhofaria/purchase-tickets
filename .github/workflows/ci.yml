name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout do repo
        uses: action/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: testes
        run: npm run test
        env:

        REDIS_HOST: localhost
        REDIS_PORT: 6379
        DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD_PROD }}
